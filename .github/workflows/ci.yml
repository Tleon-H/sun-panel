name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@8.15.9 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm run test:unit

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: service/go.sum

      - name: Generate embedded assets
        working-directory: service
        run: |
          go install github.com/go-bindata/go-bindata/go-bindata@v3.1.2+incompatible
          go install github.com/elazarl/go-bindata-assetfs/go-bindata-assetfs@v1.0.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          rm -f bindata.go
          go-bindata-assetfs -o=assets/bindata.go -pkg=assets assets/...
          rm -f bindata.go

      - name: Test
        working-directory: service
        run: |
          rm -f bindata.go
          go test ./...
